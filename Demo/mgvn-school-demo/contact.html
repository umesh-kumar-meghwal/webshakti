<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>
  tailwind.config = {
    corePlugins: { preflight: false },
    theme: { extend: { colors: {
      ink: '#16224D', saffron: '#F4A21D', leaf: '#2E7D5B', mist: '#F3F6FB', rose: '#C8334B'
    }, fontFamily: { head: ['Baloo 2','sans-serif'], body: ['Mukta','sans-serif'] } } }

</script>
<link rel="stylesheet" href="css/style.css">

<body data-page="contact">
<div id="progress"></div>
<div id="site-header"></div>

<section class="page-hero" style="--bg:url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?auto=format&fit=crop&w=1600&q=70')">
  <div class="container position-relative">
    <p class="crumb"><a href="index.html">Home</a> <i class="bi bi-chevron-right"></i> Contact</p>
    <h1 class="font-head">Contact Us</h1>
  </div>
</section>

<section class="section"><div class="container"><div class="row g-5">
  <div class="col-lg-5 reveal-l">
    <p class="kicker">Get in touch</p><h2 class="sec-title font-head">We are happy to help</h2>
    <div class="ci"><i class="bi bi-geo-alt"></i><div><b>Address</b><p>Mahatma Ghani Vidya Niketan School, Sangod</p></div></div>
    <div class="ci"><i class="bi bi-telephone"></i><div><b>Phone</b><p><a href="tel:+910000000000">+91 00000 00000</a></p></div></div>
    <div class="ci"><i class="bi bi-envelope"></i><div><b>Email</b><p><a href="mailto:info@mgvnschool.in">info@mgvnschool.in</a></p></div></div>
    <div class="ci"><i class="bi bi-clock"></i><div><b>Office hours</b><p>Monday to Saturday, 8:00 am to 2:00 pm</p></div></div>
  </div>
  <div class="col-lg-7 reveal-r">
    <form id="contactForm" class="form-card" novalidate>
      <h3 class="font-head mb-3">Send us a message</h3>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Your name</label><input class="form-control" name="name" required></div>
        <div class="col-md-6"><label class="form-label">Mobile number</label><input class="form-control" name="phone" required></div>
        <div class="col-12"><label class="form-label">Message</label><textarea class="form-control" rows="4" name="msg" required></textarea></div>
        <div class="col-12"><button class="btn btn-ink btn-lg w-100" type="submit"><i class="bi bi-whatsapp"></i> Send on WhatsApp</button></div>
      </div>
      <p class="small text-muted mt-3 mb-0" id="formMsg"></p>
    </form>
  </div>
  <div class="col-12 reveal">
    <div class="map-box"><iframe title="School location" src="https://www.google.com/maps?q=Sangod&output=embed" loading="lazy" allowfullscreen></iframe></div>
  </div>
</div></div></section>

<div id="site-footer"></div>
<a href="#" id="toTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></a>
<div id="lightbox" aria-hidden="true"><button id="lbClose" aria-label="Close"><i class="bi bi-x-lg"></i></button><img alt=""><p></p></div>
