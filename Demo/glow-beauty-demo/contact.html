<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Glow Beauty - Makeup, Bridal & Salon</title>
<meta name="description" content="Contact and book an appointment at Glow Beauty.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { corePlugins: { preflight: false },
    theme: { extend: { colors: { cocoa: '#140b0d', rose: '#ff5c8d', blush: '#ffe4ec' }, fontFamily: { serif: ['Playfair Display','serif'], sans: ['Jost','sans-serif'] } } } }
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<div id="progress"></div>
<div id="site-header"></div>

<section class="page-hero" style="--bg:url('https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1600&q=70')">
  <div class="container position-relative">
    <p class="crumb"><a href="index.html">Home</a> <i class="bi bi-chevron-right"></i> Contact</p>
    <h1>Contact Us</h1>
  </div>
</section>
<section class="section light"><div class="container"><div class="row g-5">
  <div class="col-lg-5 reveal-l"><span class="script">Get in touch</span><h2>Visit or call us</h2>
    <div class="ci dk"><i class="bi bi-geo-alt-fill"></i><div><b>Address</b><p>Glow Beauty, Rajasthan, India</p></div></div>
    <div class="ci dk"><i class="bi bi-telephone-fill"></i><div><b>Phone</b><p><a href="tel:+919876543210">+91 98765 43210</a></p></div></div>
    <div class="ci dk"><i class="bi bi-envelope-fill"></i><div><b>Email</b><p><a href="mailto:hello@glowbeauty.in">hello@glowbeauty.in</a></p></div></div>
    <div class="ci dk"><i class="bi bi-clock-fill"></i><div><b>Timing</b><p>Every day, 10:00 am to 8:00 pm</p></div></div></div>
  <div class="col-lg-7 reveal-r">
    <form class="form-card appt-form" id="apptForm" novalidate>
      <h3>Book your appointment</h3>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Your name</label><input class="form-control" name="name" required></div>
        <div class="col-md-6"><label class="form-label">Mobile number</label><input class="form-control" name="phone" inputmode="numeric" pattern="[0-9]{10}" required></div>
        <div class="col-md-6"><label class="form-label">Service</label><select class="form-select" name="service" required><option value="">Select service</option><option>Bridal Makeup</option><option>Party Makeup</option><option>Hair Styling</option><option>Nail Art</option><option>Facials &amp; Skin Care</option><option>Pre-Bridal Package</option></select></div>
        <div class="col-md-6"><label class="form-label">Preferred date</label><input type="date" class="form-control" name="date" required></div>
        <div class="col-12"><label class="form-label">Message (optional)</label><textarea class="form-control" rows="3" name="msg"></textarea></div>
        <div class="col-12"><button class="btn btn-rose btn-lg w-100" type="submit"><i class="bi bi-whatsapp"></i> Book on WhatsApp</button></div>
      </div><p class="small mt-3 mb-0 formMsg"></p>
    </form></div>
  <div class="col-12 reveal"><div class="map-box"><iframe title="Location" src="https://www.google.com/maps?q=Rajasthan,India&output=embed" loading="lazy" allowfullscreen></iframe></div></div>
</div></div></section>

<div id="site-footer"></div>
<a href="#" id="toTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></a>
<div id="lightbox" aria-hidden="true"><button id="lbClose" aria-label="Close"><i class="bi bi-x-lg"></i></button><img alt=""><p></p></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
