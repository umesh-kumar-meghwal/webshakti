<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Toppers Coaching Institute</title>
<meta name="description" content="Contact Toppers Coaching Institute and book a free demo class.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { corePlugins: { preflight: false },
    theme: { extend: { colors: { navy: '#0A1B4D', gold: '#FFC61A', deep: '#061236' }, fontFamily: { sans: ['Poppins','sans-serif'] } } } }
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<div id="progress"></div>
<div id="site-header"></div>

<section class="page-hero" style="--bg:url('https://images.unsplash.com/photo-1588072432836-e10032774350?auto=format&fit=crop&w=1600&q=70')">
  <div class="container position-relative">
    <p class="crumb"><a href="index.html">Home</a> <i class="bi bi-chevron-right"></i> Contact</p>
    <h1>Contact Us</h1>
  </div>
</section>
<section class="section"><div class="container"><div class="row g-5">
  <div class="col-lg-5 reveal-l"><span class="kick">Get in touch</span><h2 class="sec-h2">Book your free demo class</h2>
    <div class="ci"><i class="bi bi-geo-alt-fill"></i><div><b>Address</b><p>Toppers Coaching Institute, your address here</p></div></div>
    <div class="ci"><i class="bi bi-telephone-fill"></i><div><b>Phone</b><p><a href="tel:+910000000000">+91 00000 00000</a></p></div></div>
    <div class="ci"><i class="bi bi-envelope-fill"></i><div><b>Email</b><p><a href="mailto:info@toppers.in">info@toppers.in</a></p></div></div>
    <div class="ci"><i class="bi bi-clock-fill"></i><div><b>Timing</b><p>Monday to Saturday, 7:00 am to 8:00 pm</p></div></div>
  </div>
  <div class="col-lg-7 reveal-r">
    <form id="enrollForm" class="form-card" novalidate><h3 class="mb-3">Enroll now</h3>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Student name</label><input class="form-control" name="name" required></div>
        <div class="col-md-6"><label class="form-label">Mobile number</label><input class="form-control" name="phone" inputmode="numeric" pattern="[0-9]{10}" required></div>
        <div class="col-md-6"><label class="form-label">Class</label><select class="form-select" name="cls" required><option value="">Select class</option><option>Class 6 to 8</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option><option>Dropper</option></select></div>
        <div class="col-md-6"><label class="form-label">Course</label><select class="form-select" name="course" required><option value="">Select course</option><option>Foundation</option><option>Board Booster</option><option>JEE</option><option>NEET</option><option>Commerce</option><option>Olympiad / NTSE</option></select></div>
        <div class="col-12"><label class="form-label">Message (optional)</label><textarea class="form-control" rows="3" name="msg"></textarea></div>
        <div class="col-12"><button class="btn btn-gold btn-lg w-100" type="submit"><i class="bi bi-whatsapp"></i> Send on WhatsApp</button></div>
      </div><p class="small mt-3 mb-0" id="formMsg"></p></form>
  </div>
  <div class="col-12 reveal"><div class="map-box"><iframe title="Location map" src="https://www.google.com/maps?q=coaching+institute&output=embed" loading="lazy" allowfullscreen></iframe></div></div>
</div></div></section>

<div id="site-footer"></div>
<a href="#" id="toTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></a>
<div id="lightbox" aria-hidden="true"><button id="lbClose" aria-label="Close"><i class="bi bi-x-lg"></i></button><img alt=""><p></p></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
